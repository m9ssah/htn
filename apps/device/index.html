<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Kiosk: the viewport is the panel. No zoom, no scroll, no chrome. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>JIT UI</title>
    <link rel="stylesheet" href="./src/shell.css" />
  </head>
  <body>
    <div class="shell" id="shell" data-state="greeting" data-rail="bottom">
      <div class="stage">
        <!-- Resting state: the device's face, then its home. -->
        <section class="greeting" id="greeting"></section>
        <section class="home" id="home"></section>
        <!-- Generated surfaces. The renderer owns everything inside. -->
        <section class="surface" id="surface"></section>
      </div>

      <!--
        Push to talk. Hold it (or the space key) to listen, release to send.
        It carries the mic's state itself, so there is one thing to look at
        rather than a button and a separate indicator that can disagree.
      -->
      <button class="talk" id="talk" type="button" aria-label="Hold to talk">
        <span class="talk-vu" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="talk-label" id="talk-label">Hold to talk</span>
      </button>

      <!--
        Only shown when the microphone cannot work at all — a Chromium without
        the speech service, or a denied permission. Without it such a device
        has no way to be driven at all; it is not an everyday affordance.
      -->
      <input class="utterance" id="utterance" type="text" autocomplete="off"
             placeholder="type instead" aria-label="Utterance" hidden />
      <p class="status" id="status" hidden></p>

      <footer class="rail" id="rail"></footer>
      <div class="fader" id="fader" hidden></div>
      <!-- What the device is hearing, while it is still being said. -->
      <p class="heard" id="heard" hidden></p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
